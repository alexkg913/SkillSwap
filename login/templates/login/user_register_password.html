{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Create Password | SkillSwap</title>
        <link rel="stylesheet" href="{% static 'auth.css' %}">
    </head>
    <body>
        <main class="login-page">

            <!-- The logo will remain as the dog until otherwise -->
            <div class="project">
                <div class="project-logo">
                    <!-- Come back to this, logo -->
                </div>

                <span>SKILLSWAP</span>
            </div>

            <!-- Register Page Part 2 -->
            <section class="login-general">
                <h1>Create a SkillSwap Account</h1>
                <form method="POST" action="{% url 'user_password' %}">
                    {% csrf_token %}

                    <!-- New account password -->
                    <div class="form-group">
                        <label for="password">
                            PASSWORD
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="new-password"
                            aria-describedby="password-rules"
                            required
                        >
                        <details class="password-requirements" id="password-requirements">
                            <summary>Password requirements</summary>
                            <ul id="password-rules">
                                <li id="rule-length">At least 10 characters</li>
                                <li id="rule-uppercase">At least 1 uppercase letter</li>
                                <li id="rule-special">At least 1 special character</li>
                                <li id="rule-number">At least 1 number</li>
                            </ul>
                        </details>
                    </div>

                    <button
                        type="submit"
                        class="login-button"
                    >
                        SIGN UP
                    </button>
                </form>

                <!-- If the user already has an account, reroute -->
                <div class="register">
                    <span>
                        Already have a SkillSwap account?
                    </span>

                    <a href="{% url 'login' %}">
                        Sign in -->
                    </a>
                </div>
            </section>
        </main>
        <script>
            const passwordInput = document.getElementById("password");
            const requirements = document.getElementById("password-requirements");
            const rules = [
                ["rule-length", value => Array.from(value).length >= 10],
                ["rule-uppercase", value => /[A-Z]/.test(value)],
                ["rule-special", value => /[^A-Za-z0-9\s]/.test(value)],
                ["rule-number", value => /[0-9]/.test(value)],
            ];

            passwordInput.addEventListener("input", () => {
                requirements.open = true;
                for (const [id, check] of rules) {
                    document.getElementById(id).classList.toggle(
                        "met", check(passwordInput.value)
                    );
                }
            });
        </script>
    </body>
</html>
